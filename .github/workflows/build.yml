name: Build and Test XSSDetector

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [8, 11, 17]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Java ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven
        
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build on Linux/macOS
      if: runner.os != 'Windows'
      run: |
        chmod +x build.sh
        ./build.sh
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}
        
    - name: Build on Windows
      if: runner.os == 'Windows'
      run: |
        build.bat
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}
        
    - name: Verify JAR file
      run: |
        if [ -f "XSSDetector.jar" ]; then
          echo "✅ JAR file created successfully"
          ls -la XSSDetector.jar
        else
          echo "❌ JAR file not found"
          exit 1
        fi
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: XSSDetector-${{ matrix.os }}-Java${{ matrix.java }}
        path: XSSDetector.jar
        retention-days: 30
        
  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'
        
    - name: Run unit tests
      run: |
        # Add unit tests here when implemented
        echo "Running unit tests..."
        # ./run-tests.sh
        
    - name: Run integration tests
      run: |
        # Add integration tests here when implemented
        echo "Running integration tests..."
        # ./run-integration-tests.sh
        
    - name: Static code analysis
      run: |
        echo "Running static code analysis..."
        # Add static analysis tools here
        # Example: SonarQube, SpotBugs, etc.
        
  security:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'
        
    - name: Security scan
      run: |
        echo "Running security scan..."
        # Add security scanning tools here
        # Example: OWASP Dependency Check, Snyk, etc.
        
    - name: Dependency vulnerability check
      run: |
        echo "Checking for vulnerable dependencies..."
        # Add dependency vulnerability scanning here
        
  quality:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Code quality check
      run: |
        echo "Running code quality checks..."
        # Add code quality tools here
        # Example: Checkstyle, PMD, etc.
        
    - name: Documentation check
      run: |
        echo "Checking documentation..."
        # Verify README, CHANGELOG, etc. are up to date
        
  release:
    runs-on: ubuntu-latest
    needs: [build, test, security, quality]
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: XSSDetector-ubuntu-latest-Java11
        path: ./artifacts
        
    - name: Create release assets
      run: |
        mkdir -p release
        cp artifacts/XSSDetector.jar release/
        cp README.md release/
        cp LICENSE release/
        cp CHANGELOG.md release/
        
    - name: Upload release assets
      uses: actions/upload-artifact@v4
      with:
        name: release-assets
        path: release/
        retention-days: 90 