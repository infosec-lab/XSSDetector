name: Build XSSDetector

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

jobs:
  build:
    name: Build (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [11, 17]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'

    - name: Build on Linux/macOS
      if: runner.os != 'Windows'
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Build on Windows
      if: runner.os == 'Windows'
      shell: cmd
      run: build.bat

    - name: Verify JAR file
      shell: bash
      run: |
        if [ -f "dist/XSSDetector.jar" ]; then
          echo "JAR built successfully:"
          ls -la dist/XSSDetector.jar
        else
          echo "ERROR: dist/XSSDetector.jar not found"
          exit 1
        fi

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: XSSDetector-${{ matrix.os }}-Java${{ matrix.java }}
        path: dist/XSSDetector.jar
        retention-days: 30
