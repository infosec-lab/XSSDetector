         echo "" >> XSSDetector-2.0.0/RELEASE_NOTES.md
         echo "## Documentation" >> XSSDetector-2.0.0/RELEASE_NOTES.md
         echo "" >> XSSDetector-2.0.0/RELEASE_NOTES.md
         echo "- README.md - Quick start guide" >> XSSDetector-2.0.0/RELEASE_NOTES.md
         echo "- INSTALLATION.md - Detailed installation instructions" >> XSSDetector-2.0.0/RELEASE_NOTES.md
