name: Production Release - XSSDetector 2.0.0

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '2.0.0'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'Production release with comprehensive XSS detection capabilities'

jobs:
  production-build:
    runs-on: ubuntu-latest
    name: Production Build & Verification
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'
        
    - name: Production compilation check
      run: |
        echo "🔍 Running production compilation check..."
        javac -cp "src" src/burp/*.java
        echo "✅ Compilation successful"
        
    - name: Build production JAR
      run: |
        echo "🏗️ Building production JAR..."
        chmod +x build.sh
        ./build.sh
        echo "✅ Production JAR built successfully"
        
    - name: Verify JAR contents
      run: |
        echo "🔍 Verifying JAR contents..."
        jar tf dist/XSSDetector.jar | head -20
        echo "✅ JAR verification complete"
        
    - name: Production readiness check
      run: |
        echo "🔍 Running production readiness checks..."
        
        # Check for critical issues
        echo "Checking for TODO/FIXME comments..."
        if grep -r "TODO\|FIXME\|XXX\|HACK" src/; then
          echo "⚠️ Found TODO/FIXME comments - review required"
        else
          echo "✅ No TODO/FIXME comments found"
        fi
        
        # Check for debug code
        echo "Checking for debug code..."
        if grep -r "System.out.println\|e.printStackTrace" src/; then
          echo "⚠️ Found debug code - review required"
        else
          echo "✅ No debug code found"
        fi
        
        # Check file size
        JAR_SIZE=$(stat -c%s dist/XSSDetector.jar)
        echo "JAR size: $JAR_SIZE bytes"
        if [ $JAR_SIZE -gt 1000000 ]; then
          echo "⚠️ JAR file is large ($JAR_SIZE bytes)"
        else
          echo "✅ JAR file size is appropriate"
        fi
        
    - name: Upload production JAR
      uses: actions/upload-artifact@v4
      with:
        name: XSSDetector-Production-2.0.0
        path: dist/XSSDetector.jar
        retention-days: 365
        
  security-audit:
    runs-on: ubuntu-latest
    name: Security Audit
    needs: production-build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'
        
    - name: Security scan
      run: |
        echo "🔒 Running security audit..."
        
        # Check for hardcoded credentials
        echo "Checking for hardcoded credentials..."
        if grep -r "password\|secret\|key\|token" src/ | grep -v "//\|/\*"; then
          echo "⚠️ Potential hardcoded credentials found"
        else
          echo "✅ No hardcoded credentials found"
        fi
        
        # Check for SQL injection vulnerabilities
        echo "Checking for SQL injection patterns..."
        if grep -r "executeQuery\|executeUpdate\|Statement\|PreparedStatement" src/; then
          echo "⚠️ SQL operations found - verify parameterization"
        else
          echo "✅ No SQL operations found"
        fi
        
        # Check for XSS in logging
        echo "Checking for XSS in logging..."
        if grep -r "printOutput\|printError" src/ | grep -v "callbacks"; then
          echo "⚠️ Direct output found - verify sanitization"
        else
          echo "✅ Logging uses proper callbacks"
        fi
        
        echo "✅ Security audit complete"
        
  quality-assurance:
    runs-on: ubuntu-latest
    name: Quality Assurance
    needs: production-build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Code quality check
      run: |
        echo "📊 Running code quality checks..."
        
        # Count lines of code
        echo "Lines of code statistics:"
        find src/ -name "*.java" -exec wc -l {} + | tail -1
        
        # Check for proper exception handling
        echo "Checking exception handling..."
        EXCEPTION_COUNT=$(grep -r "try\|catch\|finally" src/ | wc -l)
        echo "Exception handling blocks: $EXCEPTION_COUNT"
        
        # Check for null safety
        echo "Checking null safety..."
        NULL_CHECK_COUNT=$(grep -r "!= null\|== null" src/ | wc -l)
        echo "Null checks: $NULL_CHECK_COUNT"
        
        # Check documentation
        echo "Checking documentation..."
        JAVADOC_COUNT=$(grep -r "/\*\*\|@param\|@return\|@throws" src/ | wc -l)
        echo "JavaDoc comments: $JAVADOC_COUNT"
        
        echo "✅ Quality assurance complete"
        
  documentation-verification:
    runs-on: ubuntu-latest
    name: Documentation Verification
    needs: production-build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Verify documentation
      run: |
        echo "📚 Verifying documentation..."
        
        # Check required documentation files
        REQUIRED_FILES=("README.md" "LICENSE" "CHANGELOG.md" "INSTALLATION.md" "SECURITY.md")
        
        for file in "${REQUIRED_FILES[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file exists"
          else
            echo "❌ $file missing"
            exit 1
          fi
        done
        
        # Check README content
        echo "Checking README content..."
        if grep -q "XSSDetector" README.md; then
          echo "✅ README contains project name"
        else
          echo "❌ README missing project name"
        fi
        
        if grep -q "Installation" README.md; then
          echo "✅ README contains installation instructions"
        else
          echo "❌ README missing installation instructions"
        fi
        
        echo "✅ Documentation verification complete"
        
  create-release:
    runs-on: ubuntu-latest
    name: Create Production Release
    needs: [production-build, security-audit, quality-assurance, documentation-verification]
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download production JAR
      uses: actions/download-artifact@v4
      with:
        name: XSSDetector-Production-2.0.0
        path: ./release
        
    - name: Create release package
      run: |
        echo "📦 Creating release package..."
        mkdir -p XSSDetector-2.0.0
        
        # Copy JAR file
        cp release/XSSDetector.jar XSSDetector-2.0.0/
        
        # Copy documentation
        cp README.md XSSDetector-2.0.0/
        cp LICENSE XSSDetector-2.0.0/
        cp CHANGELOG.md XSSDetector-2.0.0/
        cp INSTALLATION.md XSSDetector-2.0.0/
        cp SECURITY.md XSSDetector-2.0.0/
        cp CONTRIBUTING.md XSSDetector-2.0.0/
        
        # Copy build scripts
        cp build.bat XSSDetector-2.0.0/
        cp build.sh XSSDetector-2.0.0/
        
                 # Create release notes
         echo "# XSSDetector 2.0.0 - Production Release" > XSSDetector-2.0.0/RELEASE_NOTES.md
         echo "" >> XSSDetector-2.0.0/RELEASE_NOTES.md
         echo "## Production Ready Release" >> XSSDetector-2.0.0/RELEASE_NOTES.md
         echo "" >> XSSDetector-2.0.0/RELEASE_NOTES.md
         echo "This is the official production release of XSSDetector 2.0.0, featuring comprehensive XSS detection capabilities with a professional user interface." >> XSSDetector-2.0.0/RELEASE_NOTES.md
