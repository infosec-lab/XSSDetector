         echo "---" >> XSSDetector-2.0.0/RELEASE_NOTES.md
         echo "" >> XSSDetector-2.0.0/RELEASE_NOTES.md
         echo "XSSDetector 2.0.0 - Professional XSS Detection for Burp Suite" >> XSSDetector-2.0.0/RELEASE_NOTES.md
        
        # Create ZIP archive
        zip -r XSSDetector-2.0.0.zip XSSDetector-2.0.0/
        
        echo "✅ Release package created: XSSDetector-2.0.0.zip"
        
    - name: Upload release assets
