         echo "- CHANGELOG.md - Version history and changes" >> XSSDetector-2.0.0/RELEASE_NOTES.md
         echo "- SECURITY.md - Security policy and reporting" >> XSSDetector-2.0.0/RELEASE_NOTES.md
         echo "" >> XSSDetector-2.0.0/RELEASE_NOTES.md
         echo "## Support" >> XSSDetector-2.0.0/RELEASE_NOTES.md
         echo "" >> XSSDetector-2.0.0/RELEASE_NOTES.md
