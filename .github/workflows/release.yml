name: Release XSSDetector

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  release:
    name: Build and attach release JAR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'

    - name: Build
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Verify JAR
      run: |
        test -f dist/XSSDetector.jar
        ls -la dist/XSSDetector.jar

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: XSSDetector
        path: dist/XSSDetector.jar
        retention-days: 90

    - name: Attach JAR to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/XSSDetector.jar
